<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ダイスWP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <main id="game-layout">
      <div id="board-area">
        <section id="shops" aria-label="ショップ">
          <div class="shop-row">
            <div class="shop-row__combined">
              <div class="shop-row__grid" id="shop-combined-slots"></div>
              <div class="shop-row__divider"></div>
              <!-- QST欄 (2026-08-10, per user request): 3枚のカードを1つのパネルに収め、1位/2位/3位の
                   縦帯をパネルの上端から下端まで途切れず通す。各カードに「1位 4VP」等を3回書くのをやめ、
                   最下部に共通の凡例を1回だけ出す（帯があるのでどの列がどの順位かは辿れる）。凡例の中身は
                   ハードコードせず、実際に公開されているQSTカードのREWARD1-3から組み立てる -- main.js の
                   renderQsts / renderQstLegend 参照。 -->
              <div class="qst-panel">
                <div class="qst-panel__bands" aria-hidden="true">
                  <div class="qst-panel__band"></div>
                  <div class="qst-panel__band"></div>
                  <div class="qst-panel__band"></div>
                </div>
                <div class="qst-panel__content">
                  <div id="qst-slots"></div>
                  <div class="qst-legend" id="qst-legend" hidden>
                    <div class="qst-legend__ranks">
                      <div class="qst-legend__cell"></div>
                      <div class="qst-legend__cell"></div>
                      <div class="qst-legend__cell"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section id="board" aria-label="盤面"></section>
        <div id="board-message" class="board-message"></div>

        <section id="players" aria-label="プレイヤー"></section>
      </div>

      <section id="player-cards" aria-label="所持カード">
        <div class="player-cards__header">
          <h2 class="player-cards__title">所持カード</h2>
          <div class="player-cards__header-right">
            <!-- Pinned above player-role-control (2026-08-02, per user feedback: "ターンの最初に戻す
                 のボタンを...の上のあたりに常に表示して欲しい") -- always in the DOM (not hidden), just
                 disabled/dimmed when unusable, same as before. See main.js's handleUndoClick /
                 handleRoundPassClick / renderRoundPassButton. -->
            <div class="player-cards__header-buttons">
              <!-- AI進行モード (2026-08-03, per user feedback: "上記3をえらべるように") -- see main.js's
                   aiPacingMode/renderAiPacingControl. "次のAI行動へ" only appears (and is enabled) in
                   manual mode while some AI player actually has something pending. Moved up here
                   2026-08-02 along with round-indicator above (per user feedback: "スクロールするくらい
                   ならAI進行のボタンももう1行上にしてください" then "ラウンド0/4も1行上にして") -- row2
                   now holds only the 4 player role toggles. -->
              <div class="ai-pacing-control">
                <label class="status-label" for="ai-pacing-select">AI進行</label>
                <select id="ai-pacing-select">
                  <option value="instant">即時</option>
                  <option value="delayed">1手ずつ表示</option>
                  <option value="manual">手動</option>
                </select>
                <button type="button" id="ai-manual-step-button" hidden>次のAI行動へ</button>
              </div>
              <button type="button" class="undo-button" id="undo-button" disabled>↩️ ターン開始に戻す</button>
              <!-- 直前のアクションをキャンセル (2026-08-10, per user request: "ダイスをSLOTに置いたときに
                   やり直したい時のために...ダイスをキャンセルボタンが欲しい これを押すとダイスを置くのを
                   キャンセルする"; generalized 2026-08-27, per user request: "ダイスをキャンセルを直前の
                   アクションをキャンセルにして ダイスもキャンセルするし直前のフリーアクションもキャンセル
                   できるようにしてほしい" -- now a real undo STACK, one entry per die placement or free
                   action, popped one at a time per click) -- unlike #undo-button (which reverts
                   everything since the turn began in one go), this undoes one action at a time. See
                   main.js's handleCancelPreviousActionClick/actionCheckpoints. -->
              <button type="button" class="undo-button" id="dice-cancel-button" disabled>↩️ 直前のアクションをキャンセル</button>
              <button type="button" class="undo-button" id="round-pass-button" disabled>⏭️ ラウンドパス</button>
            </div>
            <div class="player-cards__header-row2">
              <!-- 人間/AI切り替え (2026-08-03, per user feedback: "4人のプレイヤー人間 AIをそれぞれ選べ
                   るようにしてほしい") -- one toggle per player seat, populated by main.js's
                   renderPlayerRoleControl (player names/colors are data-driven, not known statically
                   here). -->
              <div id="player-role-control" class="player-role-control"></div>
            </div>
          </div>
        </div>
        <div id="job-pool" class="job-pool"></div>
        <div id="player-cards-groups"></div>
      </section>
    </main>

    <!-- デバッグ履歴タイムライン (2026-08-04, 開発・検証用機能、通常のUndoとは別物) -- 常にDOMには存在する
         が、デバッグモードOFFの間は#debug-history-controls自体をhiddenにする（main.jsのrenderDebugPanel）。
         2026-08-04: 表示位置を#appの一番下に移動（本人指示「デバッグモードの表示位置 一番したにして」）。 -->
    <section id="debug-panel" class="debug-panel" aria-label="デバッグ">
      <button type="button" id="debug-mode-toggle" class="debug-panel__toggle">デバッグモード: OFF</button>
      <!-- テストゲーム開始 (2026-08-13, per user request): opens #debug-setup-overlay's CON/JOB/初期資源/
           ABCカード picker flow -- see main.js's openDebugSetupFlow. Unrelated to the ON/OFF toggle above
           (that one gates the turn-history timeline for the CURRENT game; this one configures the NEXT
           one, for P1 only). -->
      <button type="button" id="debug-setup-start-button" class="debug-panel__toggle">テストゲーム開始</button>
      <!-- ランキング (2026-08-29, per user request: "ランキングやリプレイをゲーム終了後だけでなくいつでも
           見れるように") -- opens the same #game-end-overlay (current standings + 🏆歴代ランキング/▶リプレイ)
           used at GAME_END, but usable mid-game too -- see main.js's openLiveRankingOverlay/
           renderGameEndOverlay. Always visible, same as テストゲーム開始/カードリスト. -->
      <button type="button" id="anytime-ranking-button" class="debug-panel__toggle">ランキング</button>
      <!-- カードリスト (2026-08-22, per user request): 全カード種別を閲覧専用（タップで拡大のみ、選択
           ボタンなし）で見られる画面 -- see main.js's openCardListOverlay/renderCardListOverlay。
           デバッグモードのON/OFFとは無関係、テストゲーム開始ボタンと同じく常時表示。 -->
      <button type="button" id="card-list-open-button" class="debug-panel__toggle">カードリスト</button>
      <div id="debug-history-controls" class="debug-history-controls" hidden>
        <div class="debug-history-controls__nav">
          <button type="button" id="debug-turn-back">◀ TURN</button>
          <button type="button" id="debug-turn-forward">TURN ▶</button>
          <button type="button" id="debug-round-back">◀ ROUND</button>
          <button type="button" id="debug-round-forward">ROUND ▶</button>
        </div>
        <div id="debug-history-position" class="debug-history-controls__position"></div>
        <div id="debug-history-list" class="debug-history-controls__list"></div>
      </div>
    </section>
  </div>

  <div id="card-inst-overlay" class="card-inst-overlay" hidden>
    <div class="card-inst-modal">
      <div class="card-inst-modal__header">
        <span class="card-inst-modal__title"></span>
        <button type="button" class="card-inst-modal__close" aria-label="閉じる">&times;</button>
      </div>
      <div class="card-inst-modal__visual"></div>
      <button type="button" class="card-inst-modal__flip-button" hidden>裏側</button>
      <div class="card-inst-modal__body"></div>
      <button type="button" class="card-inst-modal__pick-button" hidden></button>
    </div>
  </div>

  <!-- テストゲーム開始 picker (2026-08-13) -- see main.js's renderDebugSetupOverlay/DEBUG_SETUP_STEPS.
       One category shown at a time (CON/JOB/初期資源/ABCカード); END always advances, reaching that
       step's own max count auto-advances immediately. Cancel closes without changing anything. -->
  <div id="debug-setup-overlay" class="card-inst-overlay" hidden>
    <div class="card-inst-modal build-choice-modal">
      <div class="card-inst-modal__header">
        <span class="card-inst-modal__title" id="debug-setup-title"></span>
        <button type="button" id="debug-setup-cancel-button" class="card-inst-modal__close" aria-label="キャンセル">&times;</button>
      </div>
      <div class="card-inst-modal__body" id="debug-setup-list"></div>
      <button type="button" id="debug-setup-end-button" class="debug-setup-end-button">END（このまま次へ）</button>
    </div>
  </div>

  <!-- カードリスト (2026-08-22) -- see main.js's cardListView/renderCardListOverlay.閲覧専用: 各カード
       はタップで#card-inst-overlayの拡大表示のみ（attachPickableEnlargeにpickAction=nullで流用）、
       選択の確定は一切ない。下部の#card-list-navは常時表示、どのカテゴリを見ていても切替・「ゲームに
       戻る」が押せる。 -->
  <div id="card-list-overlay" class="card-inst-overlay" hidden>
    <div class="card-inst-modal build-choice-modal card-list-modal">
      <div class="card-inst-modal__header">
        <span class="card-inst-modal__title" id="card-list-title"></span>
      </div>
      <div class="card-inst-modal__body card-list-body" id="card-list-body"></div>
      <div id="card-list-nav" class="card-list-nav"></div>
    </div>
  </div>

  <!-- BUILD/UPGRADE candidate selection (2026-07-30, real engine wiring pass 3) -- no close button:
       once a BUILD area is triggered with a legal candidate, choosing one is mandatory (see
       main.js's renderBuildChoiceModal). -->
  <div id="build-choice-overlay" class="card-inst-overlay" hidden>
    <div class="card-inst-modal build-choice-modal">
      <div class="card-inst-modal__header">
        <span class="card-inst-modal__title">建築 / LVアップを選択</span>
        <!-- Duplicate of #undo-button (2026-07-30, per user feedback: "城にダイスをおいて建築を選ぶ
             画面でも戻れるように") -- the sidebar one sits behind this modal's backdrop while it's
             open, so a second copy lives here instead of fighting z-index/stacking-context rules to
             surface the same button through the overlay. Same handler (main.js). -->
        <button type="button" class="undo-button" id="undo-button-build" disabled>↩️ ターン開始に戻す</button>
        <!-- Duplicate of #dice-cancel-button, same reasoning -- this modal appears exactly when a die
             placement's AREA action turned out to be a BUILD, one of the most useful moments to cancel
             just that placement instead of the whole turn. -->
        <button type="button" class="undo-button" id="dice-cancel-button-build" disabled>↩️ 直前のアクションをキャンセル</button>
      </div>
      <!-- BZ付与系の直接TAPアクション（例: JOB004A "3K→2BZ"）を、建築候補選択画面に入った瞬間に使える
           ようにする案内 (2026-08-03, per user feedback: "建築が発生したときにすぐに発動 Y/Nでハイを
           押すと3K→2BZその後建築対象を選べるようになる"). See main.js's renderBuildChoiceBzTapPrompt. -->
      <div id="build-choice-bz-tap-prompt"></div>
      <div id="build-choice-payment"></div>
      <div id="build-choice-bz"></div>
      <div class="card-inst-modal__body" id="build-choice-list"></div>
    </div>
  </div>

  <!-- JOB010/革命家's PICK_JOB_REPLACEMENT (2026-08-21): B007A/革命の兆し was already taken by someone
       else, so this player draws 3 JOBs from outside the shared pool and picks 1 to replace JOB010 with
       -- see main.js's renderJobReplacementChoice/setup.resolveJobReplacementChoice. No close button,
       same reasoning as build-choice-overlay: once offered, a pick is mandatory. -->
  <div id="job-replacement-choice-overlay" class="card-inst-overlay" hidden>
    <div class="card-inst-modal build-choice-modal">
      <div class="card-inst-modal__header">
        <span class="card-inst-modal__title">革命の兆しは既に獲得済みです。代わりのJOBを選んでください</span>
      </div>
      <div class="card-inst-modal__body" id="job-replacement-choice-list"></div>
    </div>
  </div>

  <!-- CON002B's "real or Z" payment choice for an AREA that pays A/B/C directly, e.g. AREA007's
       CHANGE((A,B,C),D) (2026-07-31) -- see main.js's attemptPlaceSelectedDie/renderPlacementChoiceModal.
       Unlike the BUILD modal above, nothing has been committed yet at this point, so a cancel button
       is offered. -->
  <div id="placement-choice-overlay" class="card-inst-overlay" hidden>
    <div class="card-inst-modal placement-choice-modal">
      <div class="card-inst-modal__header">
        <span class="card-inst-modal__title">CON002B: 支払いに使う資源を選択</span>
      </div>
      <div class="card-inst-modal__body" id="placement-choice-body"></div>
      <div class="placement-choice-actions">
        <button type="button" id="placement-choice-cancel">キャンセル</button>
        <button type="button" id="placement-choice-confirm">この内容で配置</button>
      </div>
    </div>
  </div>

  <!-- 道化(JOB003)の☆ダイス: 自分の空きEXスロットと空きANYスロットが両方選べる時だけ表示 (2026-08-28,
       per user request: "自分のEXとANYと両方置けるときANYにしか置けません その時だけはどちらか選べる
       ように") -- see main.js's attemptPlaceSelectedWildcardDie/placeSelectedWildcardDie/
       renderWildcardSlotChoiceModal/board.wildcardExAnyChoice. Nothing committed yet, so cancelable. -->
  <div id="wildcard-slot-choice-overlay" class="card-inst-overlay" hidden>
    <div class="card-inst-modal placement-choice-modal">
      <div class="card-inst-modal__header">
        <span class="card-inst-modal__title">☆ダイスをどちらに置きますか？</span>
      </div>
      <div class="placement-choice-actions">
        <button type="button" id="wildcard-slot-choice-cancel">キャンセル</button>
        <button type="button" id="wildcard-slot-choice-ex">自分専用SLOTに置く</button>
        <button type="button" id="wildcard-slot-choice-any">共通SLOTに置く</button>
      </div>
    </div>
  </div>

  <!-- Bare (direct) TAP ability die+value choice, e.g. B001A's SET_DIE_VALUE(SELF1|2);
       GRANT_PLACE_ANYWHERE(...), B003A's CHANGE_DIE_VALUE(SELF±1), or JOB007's
       MONUMENT_CHANGE_DIE_VALUE(SELF+2) -- see main.js's attachTapToggle/bareTapKind/
       renderTapChoiceModal. #tap-choice-cards (2026-08-25, per user request: "カードのダイス目も変え
       られるようにしたい") offers the player's own eligible "fixed BUILD value" cards (始まりの兆し等)
       as an alternative target to a real die -- see executor.cardOwnFixedBuildValue's own doc. Nothing
       committed yet, so cancelable. -->
  <div id="tap-choice-overlay" class="card-inst-overlay" hidden>
    <div class="card-inst-modal placement-choice-modal">
      <div class="card-inst-modal__header">
        <span class="card-inst-modal__title">対象(ダイスまたはカード)と変更後の値を選択</span>
      </div>
      <div class="card-inst-modal__body">
        <div id="tap-choice-dice" class="tap-choice-dice"></div>
        <div id="tap-choice-cards" class="tap-choice-dice"></div>
        <div id="tap-choice-values" class="build-choice-payment__group"></div>
      </div>
      <div class="placement-choice-actions">
        <button type="button" id="tap-choice-cancel">キャンセル</button>
        <button type="button" id="tap-choice-confirm">この内容で使う</button>
      </div>
    </div>
  </div>

  <!-- Auto/manual mode choice for a reactive TAP ability, shown right after the card is acquired
       (BUILD/UPGRADE, or JOB draft) (2026-07-31) -- see main.js's pendingAutoModeChoice/
       renderAutoModeChoiceModal. Not blocking (the data's own AUTO default already applies), just a
       close button. -->
  <div id="auto-mode-choice-overlay" class="card-inst-overlay" hidden>
    <div class="card-inst-modal placement-choice-modal">
      <div class="card-inst-modal__header">
        <span class="card-inst-modal__title">オート / マニュアルを選択</span>
      </div>
      <div class="card-inst-modal__body">
        <div id="auto-mode-choice-card" class="tap-choice-dice"></div>
        <div class="build-choice-payment__group">
          <button type="button" id="auto-mode-choice-auto" class="build-choice-payment__option">オート</button>
          <button type="button" id="auto-mode-choice-manual" class="build-choice-payment__option">マニュアル</button>
        </div>
      </div>
      <div class="placement-choice-actions">
        <button type="button" id="auto-mode-choice-close">閉じる</button>
      </div>
    </div>
  </div>

  <!-- RESOURCE_LIMIT/FORCE_CONVERT's "はい/いいえ" TURNEND confirmation (2026-08-01) -- see main.js's
       turnEndWarnings/attemptAdvanceTurn/renderTurnEndWarningModal. Previously always auto-confirmed
       as "はい" with no real UI. "いいえ" just leaves the turn as-is (nothing has happened yet). -->
  <div id="turn-end-warning-overlay" class="card-inst-overlay" hidden>
    <div class="card-inst-modal placement-choice-modal">
      <div class="card-inst-modal__header">
        <span class="card-inst-modal__title">確認</span>
      </div>
      <div class="card-inst-modal__body" id="turn-end-warning-body"></div>
      <div class="placement-choice-actions">
        <button type="button" id="turn-end-warning-no">いいえ</button>
        <button type="button" id="turn-end-warning-yes">はい</button>
      </div>
    </div>
  </div>

  <!-- "ラウンドパス" confirmation (2026-08-02, per user feedback: "ラウンドパスを押すと このラウンドは
       全てパスします本当に良いですか Y/N と警告があり Yでラウンドパスをします") -- see main.js's
       handleRoundPassClick/renderRoundPassConfirmModal. -->
  <div id="round-pass-confirm-overlay" class="card-inst-overlay" hidden>
    <div class="card-inst-modal placement-choice-modal">
      <div class="card-inst-modal__header">
        <span class="card-inst-modal__title">確認</span>
      </div>
      <div class="card-inst-modal__body">
        <p class="turn-end-warning__text">このラウンドは全てパスします。本当に良いですか？</p>
      </div>
      <div class="placement-choice-actions">
        <button type="button" id="round-pass-confirm-no">いいえ</button>
        <button type="button" id="round-pass-confirm-yes">はい</button>
      </div>
    </div>
  </div>

  <!-- wD上限超過の確認 (2026-08-19, per user request: "上限を超えた🎲はKになります　よろしいですか"、
       いいえでキャンセル可能; text updated 2026-08-20, per user request: the overflow die is now lost
       rather than converted to K -- see main.js's WHITE_OVERFLOW_WARNING_TEXT / executor.grantOneDie's
       own doc) -- see main.js's pendingWhiteOverflowConfirm/wouldCauseWhiteOverflow/
       renderWhiteOverflowConfirmModal. Shared by every action that could trip a wD-cap overflow (die
       placement, card build/draft) -- see each commit function's own doc for where this gets set. -->
  <div id="white-overflow-confirm-overlay" class="card-inst-overlay" hidden>
    <div class="card-inst-modal placement-choice-modal">
      <div class="card-inst-modal__header">
        <span class="card-inst-modal__title">確認</span>
      </div>
      <div class="card-inst-modal__body">
        <p class="turn-end-warning__text">上限を超えた🎲は失われます。よろしいですか？</p>
      </div>
      <div class="placement-choice-actions">
        <button type="button" id="white-overflow-confirm-no">いいえ</button>
        <button type="button" id="white-overflow-confirm-yes">はい</button>
      </div>
    </div>
  </div>

  <!-- JOB007/宮廷人 tap-first offer (2026-08-22, per user request) -- see main.js's
       pendingJob007TapPrompt/withJob007TapPrompt/renderJob007TapPromptModal. Shown right before a die
       placement that would offer an UPGRADE/monument candidate, while JOB007 is owned and untapped.
       "いいえ" just proceeds without tapping -- unlike white-overflow-confirm-overlay above, declining
       here never cancels the placement itself (same "optional tap-first offer" shape as
       #build-choice-bz-tap-prompt, just needing its own confirm step since -- unlike that one -- it has
       to run BEFORE the placement, not after). -->
  <div id="job007-tap-prompt-overlay" class="card-inst-overlay" hidden>
    <div class="card-inst-modal placement-choice-modal">
      <div class="card-inst-modal__header">
        <span class="card-inst-modal__title">確認</span>
      </div>
      <div class="card-inst-modal__body">
        <p class="turn-end-warning__text">宮廷人をTAPしますか？</p>
      </div>
      <div class="placement-choice-actions">
        <button type="button" id="job007-tap-prompt-no">いいえ</button>
        <button type="button" id="job007-tap-prompt-yes">はい</button>
      </div>
    </div>
  </div>

  <!-- GAME_END final results (2026-07-31) -- see main.js's renderGameEndOverlay. At real GAME_END, no
       close button: the game is genuinely over, there's nothing left to interact with underneath. Also
       reused mid-game (2026-08-29) via the always-visible ランキング button -- #game-end-close-button is
       shown only in that case, since the live game underneath is still very much interactable. -->
  <div id="game-end-overlay" class="card-inst-overlay" hidden>
    <div class="card-inst-modal game-end-modal">
      <div class="card-inst-modal__header">
        <span class="card-inst-modal__title" id="game-end-title">ゲーム終了 — 最終結果</span>
        <!-- 2026-08-1X, per user request: "ゲーム終了 最終結果 が表示されたときにリプレイボタンを押すと
             リプレイモード...がほしい" -- opens a read-only, move-by-move playback of the whole game just
             played. See main.js's enterReplayMode/renderReplayFrame. -->
        <button type="button" class="undo-button" id="game-end-replay-button" disabled>▶ リプレイ</button>
        <!-- 2026-08-16, per user request: "ランキングとは人間対AIで歴代の得点を最高得点順に並べる
             もの" -- opens the all-time ranking overlay below. See main.js's renderRankingOverlay. -->
        <button type="button" class="undo-button" id="game-end-ranking-button">🏆 ランキング</button>
        <button type="button" class="card-inst-modal__close" id="game-end-close-button" aria-label="閉じる" hidden>&times;</button>
      </div>
      <div class="card-inst-modal__body" id="game-end-list"></div>
    </div>
  </div>

  <!-- 歴代ランキング (2026-08-16) -- see main.js's renderRankingOverlay. Opened from the GAME_END
       screen's 🏆 button. If the just-finished game has HUMAN seats not yet registered this game, a

  <!--
    Engine modules (src/*.js) are written as plain Node/CommonJS (require/module.exports) so they can
    be unit-tested with `node tests/*.smoke.js`. Confirmed 2026-07-30: main.js must still be opened by
    double-clicking index.html (file://), which blocks both `type="module"` (CORS-like restriction on
    file://) and fetch()/XHR (also CORS-blocked) -- so neither real ES modules nor a bundler/loader
    that reads file text at runtime will work here. Plain classic <script src="..."> tags DO work
    under file://, so each src/*.js file is loaded as its own sibling script, with a tiny shim below
    standing in for require()/module.exports. Order matters: each file must be loaded after every
    module it requires (see the dependency comment above each block). Classic scripts share one global
    `let`/`const` scope, which is also why board.js/turn-flow.js/qst.js don't all bind their import of
    executor.js to the same name -- see those files' own comments.
  -->
  <script>
    window.__modules = {};
    window.module = { exports: {} };
    window.require = function (name) {
      // Strips any leading ./ or ../ segments (src/ai/*.js's requires reach up a directory, e.g.
      // require('../board'), unlike every other src/*.js file's same-directory require('./board')) --
      // both collapse to the same flat registry key, matching __captureModule's own flat naming below.
      var key = name.replace(/^(\.\.\/|\.\/)+/, '').replace(/\.js$/, '');
      if (key === 'fs') throw new Error('fs is not available in the browser build (see data-loader.js\'s loadGameData)');
      if (!(key in window.__modules)) throw new Error('Module not loaded yet (check script order in index.html): ' + key);
      return window.__modules[key];
    };
    // Called after each src/*.js <script> tag: files it. window.module.exports into the registry
    // require() reads from, then resets window.module for the next file to fill in.
    function __captureModule(name) {
      window.__modules[name] = window.module.exports;
      window.module = { exports: {} };
    }
  </script>
